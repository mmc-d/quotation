name: MMC Core

on:
  push:
    branches: [main, mmc-core]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mmc
          POSTGRES_PASSWORD: mmc_dev_only
          POSTGRES_DB: mmc
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mmc" --health-interval 2s --health-retries 30
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3300:3000"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm --filter "./packages/*" build
      - name: Typecheck
        run: pnpm -r --filter "!@mmc/web" typecheck && pnpm --filter @mmc/web typecheck
      - name: Domain rules (incl. parity with the legacy index.html)
        run: pnpm --filter @mmc/domain test
      - name: Back-office connector and document templates
        run: pnpm --filter @mmc/erp-connector test && pnpm --filter @mmc/doc-templates exec vitest run
      - name: Database (migrations, row-level security, numbering, audit chain, legacy import)
        run: pnpm --filter @mmc/db test
      - name: API end-to-end (Phases 1–3)
        run: pnpm --filter @mmc/api test
      - name: Web build
        run: pnpm --filter @mmc/web build
