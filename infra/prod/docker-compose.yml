# MMC Core — production stack. Identical on this PC (http://localhost:8090) and on the VPS (https://<domain>).
#   cp .env.example .env   (fill in secrets)   then:   ./mmc.sh up
name: mmc-prod

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://mmc_app:${APP_DB_PASSWORD}@postgres:5432/mmc
  DATABASE_ADMIN_URL: postgres://mmc:${POSTGRES_PASSWORD}@postgres:5432/mmc
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  WEB_ORIGIN: ${PUBLIC_URL}
  PUBLIC_BASE_URL: ${PUBLIC_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  GOTENBERG_URL: http://gotenberg:3000
  FILES_DIR: /data/files
  MFA_ENFORCE: ${MFA_ENFORCE:-false}
  ALLOW_SANDBOX: ${ALLOW_SANDBOX:-false}
  ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  LEADS_WEBHOOK_SECRET: ${LEADS_WEBHOOK_SECRET:-}
  ESIGN_PROVIDER: ${ESIGN_PROVIDER:-sandbox}
  ESIGN_API_KEY: ${ESIGN_API_KEY:-}
  ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-}
  PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-sandbox}
  PAYMENTS_SECRET_KEY: ${PAYMENTS_SECRET_KEY:-}
  PAYMENTS_WEBHOOK_SECRET: ${PAYMENTS_WEBHOOK_SECRET}
  ERPNEXT_URL: ${ERPNEXT_URL:-}
  ERPNEXT_API_KEY: ${ERPNEXT_API_KEY:-}
  ERPNEXT_API_SECRET: ${ERPNEXT_API_SECRET:-}
  ERPNEXT_COMPANY: ${ERPNEXT_COMPANY:-}
  ERPNEXT_WEBHOOK_SECRET: ${ERPNEXT_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mmc
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmc"]
      interval: 3s
      retries: 30

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=60s", "--chromium-auto-start"]

  # One-shot: schema migrations (incl. row-level security) + idempotent seed, then exits.
  migrate:
    image: ${IMAGE_PREFIX:-mmc}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *api-env
      SEED_OWNER_EMAIL: ${OWNER_EMAIL}
    command: ["sh", "-c", "node node_modules/@mmc/db/dist/migrate.js && node node_modules/@mmc/db/dist/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: ${IMAGE_PREFIX:-mmc}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKER_IN_PROCESS: "false"
    volumes: ["files:/data/files"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      gotenberg: { condition: service_started }

  worker:
    image: ${IMAGE_PREFIX:-mmc}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment: *api-env
    volumes: ["files:/data/files"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${IMAGE_PREFIX:-mmc}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
